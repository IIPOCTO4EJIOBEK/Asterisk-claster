name: lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить проверяльщики
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck php-cli php-xml

      - name: Тесты и статические проверки
        run: ./tests/run-all.sh
