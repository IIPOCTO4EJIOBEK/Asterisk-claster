name: lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить проверяльщики
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck php-cli

      - name: Статические проверки
        run: ./scripts/lint.sh

      - name: Тест парсера конфигов PJSIP
        run: |
          mkdir -p /tmp/ast
          cat > /tmp/ast/pjsip.endpoint.conf <<'EOF'
          [base](!)
          type=endpoint
          context=from-internal
          allow=ulaw
          allow=alaw

          [564](base)
          aors=564
          allow=g722
          EOF
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('sc', 'scripts/sync-config.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          s, _ = m.parse_pjsip_conf('/tmp/ast/pjsip.endpoint.conf')
          assert 'base' not in s, 'шаблон не должен попадать в результат'
          assert s['564']['context'] == 'from-internal', 'наследование шаблона сломано'
          # Накопительные опции складываются, а не переопределяются
          assert s['564']['allow'] == 'ulaw,alaw,g722', s['564']['allow']
          print('парсер: ок')
          PY

      - name: Тест контроля доступа провижининга
        run: |
          php -r '
          require "provisioning/src/Provisioner.php";
          $f = 0;
          $t = function ($c, $m) use (&$f) { if (!$c) { echo "FAIL: $m\n"; $f = 1; } };
          $t(Provisioner::normalizeMac("00:15:65:AA:BB:CC") === "001565aabbcc", "нормализация MAC");
          $t(Provisioner::normalizeMac("zz1565aabbccdd") === null, "мусор в MAC отвергается");
          $t(Provisioner::normalizeMac("00-15-65-aa-bb") === null, "короткий MAC отвергается");
          $t(Provisioner::ipInCidrList("10.4.3.6", ["10.4.0.0/16"]), "адрес в подсети");
          $t(!Provisioner::ipInCidrList("10.5.3.6", ["10.4.0.0/16"]), "адрес вне подсети");
          $t(Provisioner::ipInCidrList("10.4.3.130", ["10.4.3.128/25"]), "невыровненная маска");
          $t(!Provisioner::ipInCidrList("10.4.3.127", ["10.4.3.128/25"]), "граница /25");
          $t(!Provisioner::ipInCidrList("10.4.3.6", []), "пустой список никого не пропускает");
          exit($f);
          '

      - name: Тест рендера шаблонов вендоров
        run: |
          php -r '
          $mac="001565aabbcc"; $extension="564"; $label="Test"; $authUser="564";
          $secret="p@ss/w|th&spec"; $primary="10.4.3.6"; $backup="10.10.10.11";
          $sipPort=5060; $expires=600; $timezone="+3"; $f=0;
          foreach (["yealink.cfg.php","fanvil.cfg.php","grandstream.xml.php"] as $tpl) {
              ob_start(); include "provisioning/templates/$tpl"; $o = ob_get_clean();
              if (!str_contains($o, $secret)) { echo "FAIL: $tpl без пароля\n"; $f=1; }
              if (!str_contains($o, $backup)) { echo "FAIL: $tpl без резервного сервера\n"; $f=1; }
          }
          ob_start(); include "provisioning/templates/grandstream.xml.php"; $x = ob_get_clean();
          if (simplexml_load_string($x) === false) { echo "FAIL: Grandstream XML невалиден\n"; $f=1; }
          $backup = "";
          ob_start(); include "provisioning/templates/yealink.cfg.php"; $o = ob_get_clean();
          if (str_contains($o, "sip_server.2")) { echo "FAIL: блок резерва без backup_server\n"; $f=1; }
          exit($f);
          '
